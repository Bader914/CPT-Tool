services:
  cpt-streamlit:
    build: .
    image: cpt-su-streamlit:latest
    container_name: cpt-su-tool
    restart: unless-stopped
    environment:
      # Wachtwoord komt uit .env (niet in git!). Ontbreekt hij, dan faalt compose
      # bewust — beter dan stilletjes terugvallen op een zwak standaardwachtwoord.
      - APP_PASSWORD=${APP_PASSWORD:?zet APP_PASSWORD in /opt/cpt-tool/.env}
    ports:
      - "8080:8501"
