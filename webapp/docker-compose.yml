services:
  cpt-tool:
    build: .
    image: cpt-su-tool:latest
    container_name: cpt-su-tool
    restart: unless-stopped
    ports:
      # host:container — pas de hostpoort aan als 8080 al bezet is
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
